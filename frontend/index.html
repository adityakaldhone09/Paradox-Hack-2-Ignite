<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Secure examination paper distribution with cryptographic protection, controlled access, and blockchain-backed chain of custody." />
    <meta property="og:title" content="VeriQ — Secure Examination Paper Distribution" />
    <meta property="og:description" content="Secure every question paper. Verify every action. Cryptographic protection, controlled access, and blockchain-backed chain of custody." />
    <meta property="og:type" content="website" />
    <title>VeriQ — Secure Examination Paper Distribution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Prevent theme flash - default to light, respect persisted preference
      (function() {
        try {
          var saved = localStorage.getItem('veriq_theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches && false)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
