version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: veriq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: veriq
      POSTGRES_PASSWORD: veriq_password_2026
      POSTGRES_DB: veriq_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veriq -d veriq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veriq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veriq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://veriq:veriq_password_2026@postgres:5432/veriq_db
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_PORT=8000
      - BACKEND_HOST=0.0.0.0
      - FRONTEND_URL=http://localhost:3000
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - JWT_SECRET=veriq_super_secret_jwt_key_hackathon_demo_2026_secure
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: veriq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  redisdata:
