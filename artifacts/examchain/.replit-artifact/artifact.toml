kind = "web"
previewPath = "/"
title = "ExamChain"
description = "A secure examination paper chain-of-custody platform for universities and testing authorities, with blockchain-backed verification, controlled release, security monitoring, and audit workflows."
version = "1.0.0"
id = "artifacts/examchain"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18399

[services.development]
run = "pnpm --filter @workspace/examchain run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/examchain", "run", "build" ]
serve = "static"
publicDir = "artifacts/examchain/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18399"
BASE_PATH = "/"
